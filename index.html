<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLwolfy's Blog</title>
  <meta name="description" content="编程、游戏、动漫爱好者！" />
  <link rel="canonical" href="https://blog.flwolfy.xyz/" />
  <link rel="alternate" hreflang="zh-CN" href="https://blog.flwolfy.xyz/zh-cn/" />
  <link rel="alternate" hreflang="zh-TW" href="https://blog.flwolfy.xyz/zh-tw/" />
  <link rel="alternate" hreflang="x-default" href="https://blog.flwolfy.xyz/" />
  <meta name="robots" content="index,follow" />
  <style>
    :root {
      --bg: #f4f7fb;
      --fg: #111827;
      --muted: #4b5563;
      --card: #ffffff;
      --line: #dbe3ef;
      --primary: #1d4ed8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: radial-gradient(circle at 20% 10%, #e8f0ff 0%, var(--bg) 48%, #eef4ff 100%);
      color: var(--fg);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      padding: 24px;
    }
    main {
      width: min(720px, 100%);
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0, 20, 60, 0.08);
    }
    h1 { margin: 0 0 12px; font-size: 1.6rem; }
    p { margin: 0 0 12px; color: var(--muted); line-height: 1.7; }
    ul { margin: 14px 0 0; padding-left: 20px; }
    a { color: var(--primary); text-underline-offset: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>选择语言 / 選擇語言</h1>
    <p>系统会尝试按你所在地区自动跳转：大陆到简体，其它地区到繁体。</p>
    <p>若未自动跳转，可手动进入：</p>
    <ul>
      <li><a href="/zh-cn/">简体中文（zh-cn）</a></li>
      <li><a href="/zh-tw/">繁體中文（zh-tw）</a></li>
    </ul>
  </main>

  <script>
    (function () {
      function withTimeout(promise, ms) {
        return Promise.race([
          promise,
          new Promise(function (resolve) {
            setTimeout(function () { resolve(null); }, ms);
          })
        ]);
      }

      function parseCountryCode(data) {
        if (!data || typeof data !== 'object') return '';
        var value = data.country_code || data.countryCode || data.country || '';
        return String(value).toUpperCase();
      }

      function detectCountryCode() {
        return withTimeout(
          fetch('https://api.country.is/', { method: 'GET' })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
              var code = parseCountryCode(data);
              if (code) return code;
              return fetch('https://ipapi.co/json/', { method: 'GET' })
                .then(function (res) { return res.ok ? res.json() : null; })
                .then(function (fallbackData) { return parseCountryCode(fallbackData); })
                .catch(function () { return ''; });
            })
            .catch(function () { return ''; }),
          1500
        ).then(function (code) {
          return code || '';
        });
      }

      detectCountryCode().then(function (code) {
        if (!code) return;
        if (code === 'CN') {
          window.location.replace('/zh-cn/');
          return;
        }
        window.location.replace('/zh-tw/');
      });
    })();
  </script>
</body>
</html>
