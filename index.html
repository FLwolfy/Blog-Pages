<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FLwolfy's Blog</title>
  <meta name="description" content="FLwolfy的博客～不定时分享编程、游戏、动漫的小干货、技巧、观后感等，期待你的拜访～" />
  <link rel="canonical" href="https://blog.flwolfy.xyz/" />
  <link rel="alternate" hreflang="zh-CN" href="https://blog.flwolfy.xyz/zh-cn/" />
  <link rel="alternate" hreflang="zh-TW" href="https://blog.flwolfy.xyz/zh-tw/" />
  <link rel="alternate" hreflang="x-default" href="https://blog.flwolfy.xyz/" />
  <meta name="robots" content="index,follow" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="FLwolfy's Blog" />
  <meta property="og:description" content="FLwolfy的博客～不定时分享编程、游戏、动漫的小干货、技巧、观后感等，期待你的拜访～" />
  <meta property="og:url" content="https://blog.flwolfy.xyz/" />
  <meta property="og:image" content="https://blog.flwolfy.xyz/zh-cn/assets/core/avatar.jpg" />
  <style>
    :root {
      --grey-0: #fceded;
      --grey-1: #faedf6;
      --grey-2: #f0ddea;
      --grey-3: #efd0f1;
      --grey-5: #7a5396;
      --grey-7: #190a32;
      --grey-8: #220701;
      --color-red: #e9546b;
      --text-color: var(--grey-7);
      --text-heading-color: var(--grey-8);
      --primary-color: var(--color-red);
      --body-color: rgb(237, 166, 93);
      --tail-color: rgb(198, 130, 59);
      --tummy-color: rgb(242, 192, 137);
      --border-color: rgb(56, 60, 75);
    }

    [data-theme="dark"] {
      --grey-0: #210011;
      --grey-1: #27171f;
      --grey-2: #301a3b;
      --grey-3: #531212;
      --grey-5: #877e9c;
      --grey-7: #c0afd2;
      --grey-8: #e4a5e9;
      --color-red: rgba(255, 125, 145, .9);
      --text-color: var(--grey-5);
      --text-heading-color: #869194;
      --primary-color: var(--color-red);
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--grey-1);
      color: var(--text-color);
      font-family: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
    }

    #loading {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      z-index: 999;
      background: var(--grey-1);
    }

    .cat {
      position: relative;
      display: block;
      width: 15em;
      height: 100%;
      font-size: 10px;
      margin: auto;
      animation: 2.74s linear infinite loading-cat;
    }

    .cat * {
      box-sizing: content-box;
    }

    .cat .head, .cat .foot, .cat .body, .cat .paw {
      position: absolute;
      top: 0;
      right: 0;
      bottom: 0;
      left: 0;
      margin: auto;
      border-radius: 50%;
      width: 15em;
      height: 15em;
    }

    .cat .body {
      background-image: radial-gradient(transparent 0%, transparent 35%, var(--border-color) 35%, var(--border-color) 39%, var(--body-color) 39%, var(--body-color) 46%, var(--tummy-color) 46%, var(--tummy-color) 60%, var(--body-color) 60%, var(--body-color) 67%, var(--border-color) 67%, var(--border-color) 100%);
      animation: 2.74s linear infinite body;
    }

    .cat .head:before,
    .cat .foot:before {
      background-image: radial-gradient(transparent 0%, transparent 35%, var(--border-color) 35%, var(--border-color) 39%, var(--body-color) 39%, var(--body-color) 67%, var(--border-color) 67%, var(--border-color) 100%);
    }

    .cat .head:before {
      content: "";
      width: 100%;
      height: 100%;
      position: absolute;
      border-radius: 50%;
      clip-path: polygon(100% 20%, 50% 50%, 70% -10%);
      -webkit-clip-path: polygon(100% 20%, 50% 50%, 70% -10%);
    }

    .cat .head:after {
      content: "";
      width: 4.125em;
      height: 2.5em;
      position: absolute;
      top: 0.8125em;
      right: 3.9375em;
      background-image: linear-gradient(var(--grey-1) 65%, transparent 65%), radial-gradient(var(--grey-1) 51%, var(--border-color) 55%, var(--border-color) 68%, transparent 70%);
      transform: rotate(-66deg);
    }

    .cat .head .face {
      width: 5em;
      height: 3.75em;
      left: 9.0625em;
      top: 1.8125em;
      position: absolute;
      transform: rotate(-47deg);
      background: radial-gradient(circle, var(--tummy-color) 0%, var(--tummy-color) 23%, transparent 23%) -0.1875em 1.0625em no-repeat, radial-gradient(circle, var(--border-color) 0%, var(--border-color) 6%, transparent 6%) 0.75em -0.75em no-repeat, radial-gradient(circle, var(--border-color) 0%, var(--border-color) 6%, transparent 6%) -0.75em -0.75em no-repeat, radial-gradient(var(--body-color) 0%, var(--body-color) 15%, transparent 15%) 0 -0.6875em no-repeat, radial-gradient(circle, transparent 5%, var(--border-color) 5%, var(--border-color) 10%, transparent 10%) -0.1875em -0.3125em no-repeat, radial-gradient(circle, transparent 5%, var(--border-color) 5%, var(--border-color) 10%, transparent 10%) 0.1875em -0.3125em no-repeat, radial-gradient(circle, var(--body-color) 45%, transparent 45%) 0 -0.1875em, linear-gradient(transparent 35%, var(--border-color) 35%, var(--border-color) 41%, transparent 41%, transparent 44%, var(--border-color) 44%, var(--border-color) 50%, transparent 50%, transparent 53%, var(--border-color) 53%, var(--border-color) 59%, transparent 59%);
    }

    .cat .foot {
      animation: 2.74s linear infinite foot;
    }

    .cat .foot:before,
    .cat .foot:after {
      content: "";
      width: 100%;
      height: 100%;
      position: absolute;
    }

    .cat .foot:before {
      border-radius: 50%;
      clip-path: polygon(50% 50%, 0% 50%, 0% 25%);
      -webkit-clip-path: polygon(50% 50%, 0% 50%, 0% 25%);
    }

    .cat .foot .tummy-end {
      width: 1.5em;
      height: 1.5em;
      position: absolute;
      border-radius: 50%;
      background-color: var(--tummy-color);
      left: 1.1875em;
      top: 6.5625em;
    }

    .cat .foot .bottom {
      width: 2.1875em;
      height: 0.9375em;
      position: absolute;
      top: 4.875em;
      left: 0.75em;
      border: 0.375em solid var(--border-color);
      border-bottom: 0;
      border-radius: 50%;
      transform: rotate(21deg);
      background: var(--body-color);
    }

    .cat .hands,
    .cat .legs,
    .cat .foot:after {
      width: 0.625em;
      height: 1.5625em;
      position: absolute;
      border: 0.375em solid var(--border-color);
      background-color: var(--body-color);
    }

    .cat .hands {
      border-top: 0;
      border-radius: 0 0 0.75em 0.75em;
    }

    .cat .hands.left {
      top: 4.3em;
      left: 13.1875em;
      transform: rotate(-20deg);
    }

    .cat .hands.right {
      top: 5.125em;
      left: 10.975em;
      transform: rotate(-25deg);
    }

    .cat .legs {
      border-bottom: 0;
      border-radius: 0.75em 0.75em 0 0;
    }

    .cat .legs.left {
      top: 4.0625em;
      left: 3.125em;
      transform: rotate(25deg);
    }

    .cat .legs.right {
      top: 3.3125em;
      left: 0.75em;
      transform: rotate(22deg);
    }

    .cat .foot:after {
      width: 0.9em;
      height: 2.5em;
      top: 2.625em;
      left: 2.5em;
      z-index: -1;
      transform: rotate(25deg);
      background-color: var(--tail-color);
      border-bottom: 0;
      border-radius: 0.75em 0.75em 0 0;
    }

    #lang-chooser {
      display: none;
      min-height: 100vh;
      place-items: center;
      padding: 24px;
    }

    main {
      width: min(720px, 100%);
      background: var(--grey-0);
      border: 1px solid var(--grey-2);
      border-radius: 14px;
      padding: 28px 22px;
      box-shadow: 0 10px 30px rgba(0, 20, 60, 0.08);
    }
    h1 { margin: 0 0 12px; font-size: 1.6rem; color: var(--text-heading-color); }
    p { margin: 0 0 12px; color: var(--text-color); line-height: 1.7; }
    ul { margin: 14px 0 0; padding-left: 20px; }
    a { color: var(--primary-color); text-underline-offset: 2px; }

    @keyframes body {
      0% { clip-path: polygon(50% 50%, 0% 50%, 0% 100%, 100% 100%, 100% 20%); }
      10% { clip-path: polygon(50% 50%, 30% 120%, 50% 100%, 100% 100%, 100% 20%); }
      20% { clip-path: polygon(50% 50%, 100% 90%, 120% 90%, 100% 100%, 100% 20%); }
      40% { clip-path: polygon(50% 50%, 100% 45%, 120% 45%, 120% 50%, 100% 20%); }
      50% { clip-path: polygon(50% 50%, 100% 45%, 120% 45%, 120% 50%, 100% 20%); }
      65% { clip-path: polygon(50% 50%, 100% 65%, 120% 65%, 120% 50%, 100% 20%); }
      80% { clip-path: polygon(50% 50%, 75% 130%, 120% 65%, 120% 50%, 100% 20%); }
      90% { clip-path: polygon(50% 50%, -20% 110%, 50% 120%, 100% 100%, 100% 20%); }
      100% { clip-path: polygon(50% 50%, 0% 50%, 0% 100%, 100% 100%, 100% 20%); }
    }

    @keyframes loading-cat {
      0% { transform: rotate(0deg); }
      10% { transform: rotate(-80deg); }
      20% { transform: rotate(-180deg); }
      40% { transform: rotate(-245deg); }
      50% { transform: rotate(-250deg); }
      68% { transform: rotate(-300deg); }
      90% { transform: rotate(-560deg); }
      100% { transform: rotate(-720deg); }
    }

    @keyframes foot {
      0% { transform: rotate(-10deg); }
      10% { transform: rotate(-100deg); }
      20% { transform: rotate(-145deg); }
      35% { transform: rotate(-190deg); }
      50% { transform: rotate(-195deg); }
      70% { transform: rotate(-165deg); }
      100% { transform: rotate(-10deg); }
    }
  </style>
</head>
<body>
  <div id="loading">
    <div class="cat">
      <div class="body"></div>
      <div class="head">
        <div class="face"></div>
      </div>
      <div class="foot">
        <div class="tummy-end"></div>
        <div class="bottom"></div>
        <div class="legs left"></div>
        <div class="legs right"></div>
      </div>
      <div class="paw">
        <div class="hands left"></div>
        <div class="hands right"></div>
      </div>
    </div>
  </div>

  <div id="lang-chooser">
    <main>
      <h1>选择语言 / 選擇語言</h1>
      <p>系统会尝试按你所在地区自动跳转语言。</p>
      <p>若未自动跳转，可手动进入：</p>
      <ul>
        <li><a href="/zh-cn/">简体中文（zh-cn）</a></li>
        <li><a href="/zh-tw/">繁體中文（zh-tw）</a></li>
      </ul>
    </main>
  </div>

  <script>
    (function () {
      var savedTheme = '';
      try { savedTheme = localStorage.getItem('theme') || ''; } catch (e) {}
      if (savedTheme === 'dark' || savedTheme === 'light') {
        document.documentElement.setAttribute('data-theme', savedTheme);
      } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }

      function withTimeout(promise, ms) {
        return Promise.race([
          promise,
          new Promise(function (resolve) {
            setTimeout(function () { resolve(null); }, ms);
          })
        ]);
      }

      function parseCountryCode(data) {
        if (!data || typeof data !== 'object') return '';
        var value = data.country_code || data.countryCode || data.country || '';
        return String(value).toUpperCase();
      }

      function detectCountryCode() {
        return withTimeout(
          fetch('https://api.country.is/', { method: 'GET' })
            .then(function (res) { return res.ok ? res.json() : null; })
            .then(function (data) {
              var code = parseCountryCode(data);
              if (code) return code;
              return fetch('https://ipapi.co/json/', { method: 'GET' })
                .then(function (res) { return res.ok ? res.json() : null; })
                .then(function (fallbackData) { return parseCountryCode(fallbackData); })
                .catch(function () { return ''; });
            })
            .catch(function () { return ''; }),
          1500
        ).then(function (code) {
          return code || '';
        });
      }

      detectCountryCode().then(function (code) {
        if (!code) {
          document.getElementById('loading').style.display = 'none';
          document.getElementById('lang-chooser').style.display = 'grid';
          return;
        }
        if (code === 'CN') {
          window.location.replace('/zh-cn/');
          return;
        }
        window.location.replace('/zh-tw/');
      }).catch(function () {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('lang-chooser').style.display = 'grid';
      });
    })();
  </script>
</body>
</html>
